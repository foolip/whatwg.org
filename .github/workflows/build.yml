name: Build
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  # Trigger for changes in the whatwg/sg repo.
  repository_dispatch:
    types:
    - sg_repo_updated
jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    # The R2 credentials are secrets of the production environment, which only
    # the main branch can use. PR builds run without an environment.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'repository_dispatch') && 'production' || '' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: pip install -r requirements.txt
    - run: npm install
    - run: shellcheck deploy.sh
    - run: shellcheck resources.whatwg.org/build/*.sh
    - run: bash ./deploy.sh
      env:
        SERVER: ${{ secrets.MARQUEE_SERVER }}
        SERVER_PUBLIC_KEY: ${{ secrets.MARQUEE_PUBLIC_KEY }}
        SERVER_DEPLOY_KEY: ${{ secrets.MARQUEE_DEPLOY_KEY }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
